# Run configuration. Everything that affects results lives here or in prompts/,
# and both are hashed into results/<run>/manifest.json.
seed: 20261014
temperature: 1.0
max_tokens: 1500            # per model turn; generous so a model that reasons first is not cut off
concurrency: 6
games_per_cell: 160         # target (the full study); run.py --games-per-cell sets the size actually run

# One model per vendor, matched on price tier (the lowest-priced current text model of each vendor).
# Prices: USD per million tokens, from each vendor's pricing page, checked 2026-10-14.
#   Anthropic: platform.claude.com/docs/en/about-claude/pricing
#   OpenAI:    developers.openai.com/api/docs/pricing
# max_spend_usd is a hard cap per model: when reached, unfinished games are discarded and the run
# can resume. reasoning_effort is passed to OpenAI only if set.
models:
  - label: claude
    provider: anthropic
    id: claude-haiku-5-5
    price_in: 0.10
    price_out: 0.50
    max_spend_usd: 5.0
  - label: openai
    provider: openai
    id: gpt-6-luna
    price_in: 0.10
    price_out: 0.50
    max_spend_usd: 5.0
    reasoning_effort: none
  # Experiment 4 (stronger-model check): run only when named with --models, and only on the arms in PREREG.md.
  # IDs and prices from each vendor's pricing page, checked 2026-10-19.
  - label: claude_sonnet
    provider: anthropic
    id: claude-sonnet-5-5
    price_in: 2.00
    price_out: 10.00
    max_spend_usd: 2.0
    sensitivity: true
  - label: openai_sol
    provider: openai
    id: gpt-6.1-sol
    price_in: 2.00
    price_out: 10.00
    max_spend_usd: 3.0
    api: responses          # gpt-6.1-sol rejects function tools on Chat Completions (probe_sol.py, 2026-10-19)
    reasoning_effort: low   # it always reasons; 'none' is unsupported. low = the cheapest setting it accepts
    max_tokens: 4000        # reasoning tokens count against the per-turn limit
    sensitivity: true

experiments:
  1: [A0, C1, C2, C3, C4]
  2: [D1, D2, D3, D4]

analysis:
  bootstrap_resamples: 5000
  bootstrap_seed: 7
  ci_level: 0.95
  smallest_effect_points: 10   # percentage points of efficiency
  human_baseline_csv: data/human_baseline_johnson_mislin_2011.csv
